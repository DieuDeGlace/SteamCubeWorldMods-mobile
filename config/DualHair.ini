[DualHair]
Enabled=1
; Send your second hair colour to other players who also have DualHair.
Multiplayer=1
; Default fade for new looks: where the second colour begins (percent of the
; way down the hair) and how long the fade is (0 = a hard split).
StartPercent=40
BlendPercent=35
; Moves the board (in panel units) if it overlaps something.
PanelOffsetX=0
PanelOffsetY=0

[Characters]
; CharacterName=R,G,B,START,BLEND  (set by the board or /hair2; the first
; colour is the normal in-game hair colour)
